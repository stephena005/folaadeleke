<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home B · Spotlight — Fola Adeleke®</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="shared.css" />
<style>
  /* B · SPOTLIGHT
     A bento wall. One print takes the stage; the grid beside it is the
     queue. Every 5s the "up next" tile flies into the spotlight and the
     queue ripples forward in a diagonal wave. A ticker of every title
     runs along the foot. Click any tile to put it on stage. */
  body { background: #fff; color: #000; }
  .stage-wrap {
    position: fixed; top: var(--nav-height); left: 0; right: 0; bottom: 38px;
    display: grid; gap: 2px; background: #fff; padding: 2px;
    grid-template-columns: 1.55fr 1fr;
  }
  .stage { position: relative; overflow: hidden; background: #000; display: block; color: #fff; text-decoration: none; }
  .stage .slide {
    position: absolute; inset: 0; background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.2s ease;
  }
  .stage .slide.on { opacity: 1; }
  .stage .slide.on .ken { animation: ken 7s linear forwards; }
  .stage .ken { position: absolute; inset: 0; }
  @keyframes ken { from { transform: scale(1) translate(0,0); } to { transform: scale(1.08) translate(-1.2%, -1.6%); } }

  /* the art sits on a blurred bed of itself so portrait prints still fill the stage */
  .stage .slide .bed { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.55); }
  .stage .slide .art { position: absolute; background-size: contain; background-repeat: no-repeat; background-position: center; }
  .stage .slide.hero .art { inset: 0; background-size: cover; }

  .stage-ui {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 40px clamp(20px, 3vw, 48px) 28px;
    background: linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,.25) 60%, rgba(0,0,0,0));
  }
  .stage-ui h1 { font-weight: normal; font-size: clamp(30px, 4.2vw, 64px); line-height: 1.04; margin: 10px 0 18px; }
  .stage-ui h1 span { display: block; overflow: hidden; }
  .stage-ui h1 span i { display: block; font-style: normal; transform: translateY(105%); transition: transform 1s var(--ease); }
  .stage-ui.in h1 span i { transform: none; }
  .stage-ui.in h1 span:nth-child(2) i { transition-delay: .12s; }
  .stage-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .title-line { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.85); height: 1.4em; overflow: hidden; }
  .title-line b { display: block; font-weight: normal; animation: up .7s var(--ease); }
  @keyframes up { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
  .cta { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: #fff; }
  .progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.2); z-index: 4; }
  .progress i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); }
  .progress i.run { animation: fill var(--t) linear forwards; }
  @keyframes fill { to { transform: scaleX(1); } }
  .count { position: absolute; top: 18px; right: 22px; z-index: 4; font-size: 10px; letter-spacing: .2em; color: rgba(255,255,255,.85); font-variant-numeric: tabular-nums; }

  .queue { display: grid; gap: 2px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(var(--qrows, 4), 1fr); }
  .q { position: relative; overflow: hidden; background: #eee; cursor: pointer; border: 0; padding: 0; }
  .q .img { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .8s var(--ease), opacity .5s; }
  .q:hover .img { transform: scale(1.06); }
  .q .img.out { opacity: 0; transform: scale(1.12); }
  .q .tag {
    position: absolute; left: 8px; top: 8px; z-index: 2; background: #fff; color: #000;
    font-family: var(--font); font-size: 8px; letter-spacing: .25em; text-transform: uppercase; padding: 4px 6px;
    opacity: 0; transition: opacity .3s;
  }
  .q.next .tag { opacity: 1; }
  .q.next::after { content: ""; position: absolute; inset: 0; border: 2px solid #000; box-shadow: inset 0 0 0 2px #fff; pointer-events: none; }
  .q .name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 7px; z-index: 2;
    font-family: var(--font); font-size: 8px; letter-spacing: .2em; text-transform: uppercase; color: #fff; text-align: left;
    background: linear-gradient(0deg, rgba(0,0,0,.65), transparent); opacity: 0; transition: opacity .3s;
  }
  .q:hover .name { opacity: 1; }

  /* the flying tile that carries "up next" onto the stage */
  .flyer { position: fixed; z-index: 50; background-size: cover; background-position: center; pointer-events: none;
    transition: all .9s var(--ease); }

  .ticker {
    position: fixed; left: 0; right: 0; bottom: 0; height: 38px; background: #000; color: #fff; overflow: hidden;
    display: flex; align-items: center; border-top: 1px solid #000;
  }
  .ticker-track { display: flex; white-space: nowrap; animation: marquee 80s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker a { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; text-decoration: none; padding: 0 22px; opacity: .55; transition: opacity .3s; }
  .ticker a::after { content: "●"; font-size: 5px; vertical-align: middle; margin-left: 44px; opacity: .6; }
  .ticker a.live { opacity: 1; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  @media (max-width: 800px) {
    .stage-wrap { grid-template-columns: 1fr; grid-template-rows: 1.5fr 1fr; }
    .queue { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
    .stage-ui { padding: 28px 18px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ticker-track, .stage .slide.on .ken { animation: none; }
    .flyer { display: none; }
  }
</style>
</head>
<body>
<main class="stage-wrap">
  <a class="stage" id="stage" href="/prints">
    <div class="progress"><i id="bar"></i></div>
    <span class="count" id="count">01 / 35</span>
    <div class="stage-ui" id="ui">
      <p class="label" style="color:rgba(255,255,255,.75)">Fola Adeleke — Mixed Media Artist</p>
      <h1><span><i>LAYERED MEMORY.</i></span><span><i>LIVING COLOUR.</i></span></h1>
      <div class="stage-row">
        <p class="title-line" id="title"><b>Now hanging — The Gallery</b></p>
        <span class="cta underline-link">View The Prints &rarr;</span>
      </div>
    </div>
  </a>
  <section class="queue" id="queue" aria-label="Up next"></section>
</main>
<div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>

<script src="shared.js"></script>
<script>
(function () {
  var HOLD = 5200;
  var all = [FA.hero].concat(FA.shuffle(FA.prints));      // the gallery shot opens, then every print
  var stage = document.getElementById('stage'), queueEl = document.getElementById('queue');
  var bar = document.getElementById('bar'), countEl = document.getElementById('count'), titleEl = document.getElementById('title');
  var idx = 0, qsize, timer, busy = false;
  var qs = [];

  function pad(n) { return String(n).padStart(2, '0'); }

  function slide(p) {
    var s = document.createElement('div');
    s.className = 'slide' + (p === FA.hero ? ' hero' : '');
    var u = 'background-image:url(&quot;' + p.src + '&quot;)';
    s.innerHTML = '<div class="bed" style="' + u + '"></div><div class="ken"><div class="art" style="' + u + ';inset:' + (p === FA.hero ? '0' : '6% 6% 14%') + '"></div></div>';
    stage.insertBefore(s, stage.firstChild);
    return s;
  }

  function show(p, i) {
    var s = slide(p);
    void s.offsetWidth; s.classList.add('on');
    var olds = stage.querySelectorAll('.slide.on');
    setTimeout(function () { for (var k = 1; k < olds.length; k++) olds[k].remove(); }, 1300);
    stage.href = p.href;
    countEl.textContent = pad(i + 1) + ' / ' + pad(all.length);
    titleEl.innerHTML = '<b>Now hanging — ' + p.title + '</b>';
    bar.classList.remove('run'); bar.style.setProperty('--t', HOLD + 'ms'); void bar.offsetWidth; bar.classList.add('run');
    var links = document.querySelectorAll('.ticker a');
    links.forEach(function (a) { a.classList.toggle('live', a.dataset.slug === p.slug); });
  }

  function upcoming(n) { return all[(idx + 1 + n) % all.length]; }

  function buildQueue() {
    var mobile = innerWidth <= 800;
    qsize = mobile ? 8 : 12;
    queueEl.style.setProperty('--qrows', mobile ? 2 : 4);
    queueEl.innerHTML = ''; qs = [];
    for (var n = 0; n < qsize; n++) {
      var b = document.createElement('button');
      b.className = 'q'; b.type = 'button';
      b.innerHTML = '<div class="img"></div><span class="tag">Up next</span><span class="name"></span>';
      (function (n) { b.onclick = function () { jump(n); }; })(n);
      queueEl.appendChild(b); qs.push(b);
    }
    paintQueue(false);
  }

  // Ripple the queue forward: a diagonal wave from the top-left.
  function paintQueue(wave) {
    var cols = innerWidth <= 800 ? 4 : 3;
    qs.forEach(function (b, n) {
      var p = upcoming(n), img = b.querySelector('.img');
      var apply = function () {
        img.style.backgroundImage = 'url("' + p.src + '")';
        b.querySelector('.name').textContent = p.title;
        b.setAttribute('aria-label', 'Show ' + p.title);
        img.classList.remove('out');
      };
      b.classList.toggle('next', n === 0);
      if (!wave || FA.reduced) return apply();
      var d = ((n % cols) + Math.floor(n / cols)) * 70;
      setTimeout(function () { img.classList.add('out'); setTimeout(apply, 260); }, d);
    });
  }

  function advance(to) {
    if (busy) return; busy = true;
    var nextIdx = to == null ? (idx + 1) % all.length : to;
    var srcTile = qs[to == null ? 0 : (to - idx - 1 + all.length) % all.length];
    var p = all[nextIdx];

    var done = function () {
      idx = nextIdx; show(p, idx); paintQueue(true);
      setTimeout(function () { busy = false; }, 600);
    };
    if (FA.reduced || !srcTile) return done();

    // fly the queue tile onto the stage, then hand over
    var a = srcTile.getBoundingClientRect(), z = stage.getBoundingClientRect();
    var f = document.createElement('div'); f.className = 'flyer';
    f.style.backgroundImage = 'url("' + p.src + '")';
    f.style.left = a.left + 'px'; f.style.top = a.top + 'px'; f.style.width = a.width + 'px'; f.style.height = a.height + 'px';
    document.body.appendChild(f);
    void f.offsetWidth;
    var w = z.width * .42, h = z.height * .6;
    f.style.left = (z.left + (z.width - w) / 2) + 'px'; f.style.top = (z.top + (z.height - h) / 2) + 'px';
    f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.opacity = '0';
    setTimeout(done, 420);
    setTimeout(function () { f.remove(); }, 950);
  }

  function jump(n) { clearInterval(timer); advance((idx + 1 + n) % all.length); timer = setInterval(function () { advance(); }, HOLD); }

  function buildTicker() {
    var t = document.getElementById('ticker'), html = '';
    for (var r = 0; r < 2; r++) all.forEach(function (p) { html += '<a href="' + p.href + '" data-slug="' + p.slug + '">' + p.title + '</a>'; });
    t.innerHTML = html;
  }

  buildTicker(); buildQueue(); show(all[0], 0);
  FA.boot({ preload: all.slice(0, 14) }, function () {
    document.getElementById('ui').classList.add('in');
    paintQueue(true);
    timer = setInterval(function () { advance(); }, HOLD);
  });
  addEventListener('resize', function () { buildQueue(); });
})();
</script>
</body>
</html>
