<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Home B · Spotlight — Fola Adeleke®</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="stylesheet" href="shared.css" />
<style>
  /* B · SPOTLIGHT — v2 (conversion)
     The stage is now a product page in miniature: the print, its title,
     edition, size picker and a Buy button that goes straight to Shopify.
     It opens on the three new prints, then works through the rest.
     Autoplay stops the moment you hover the stage or pick a size, so the
     product never changes under someone about to buy it. The queue shows
     prices; the foot ticker carries the trust line and the 25% offer. */
  body { background: #fff; color: #000; }
  .stage-wrap {
    position: fixed; top: var(--nav-height); left: 0; right: 0; bottom: 38px;
    display: grid; gap: 2px; background: #fff; padding: 2px;
    grid-template-columns: 1.55fr 1fr;
  }
  .stage { position: relative; overflow: hidden; background: #000; color: #fff; display: grid; grid-template-columns: 1fr minmax(260px, 34%); }
  .art-pane { position: relative; overflow: hidden; cursor: zoom-in; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.1s ease; }
  .slide.on { opacity: 1; }
  .slide .bed { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.5); }
  .slide .ken { position: absolute; inset: 0; }
  .slide.on .ken { animation: ken 8s linear forwards; }
  .slide .art { position: absolute; inset: 7% 8%; background-size: contain; background-repeat: no-repeat; background-position: center; filter: drop-shadow(0 20px 30px rgba(0,0,0,.5)); }
  @keyframes ken { from { transform: scale(1); } to { transform: scale(1.05); } }
  .art-pane .zoom { position: absolute; left: 18px; bottom: 16px; z-index: 3; font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: rgba(255,255,255,.75); }

  /* the buy panel */
  .buy {
    position: relative; z-index: 3; background: #fff; color: #000;
    display: flex; flex-direction: column; gap: 16px; padding: 28px 26px 22px; overflow-y: auto;
  }
  .brandline { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: var(--grey-mid); padding-bottom: 14px; border-bottom: 1px solid var(--grey-light); }
  .buy .kicker { font-size: 9px; letter-spacing: .25em; text-transform: uppercase; color: var(--grey-mid); }
  .buy h1 { font-weight: normal; font-size: clamp(22px, 2vw, 30px); line-height: 1.12; min-height: 2.24em; }
  .buy h1 i { display: block; font-style: normal; animation: up .7s var(--ease); }
  @keyframes up { from { transform: translateY(40%); opacity: 0; } to { transform: none; opacity: 1; } }
  .buy .spec { font-size: 10px; letter-spacing: .06em; line-height: 1.8; color: var(--grey-mid); }
  .buy .qv-buy { margin-top: 2px; }
  .buy .more { display: flex; justify-content: space-between; gap: 12px; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; }
  .buy .more a, .buy .more button { color: #000; background: none; border: none; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; padding: 0; }
  .buy .offer { margin-top: auto; font-size: 10px; letter-spacing: .06em; color: var(--grey-mid); border-top: 1px solid var(--grey-light); padding-top: 14px; }
  .buy .offer button { background: none; border: none; border-bottom: 1px solid #000; font: inherit; color: #000; cursor: pointer; padding: 0; }

  .progress { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(0,0,0,.08); z-index: 4; }
  .progress i { display: block; height: 100%; background: #000; transform-origin: left; transform: scaleX(0); }
  .progress i.run { animation: fill var(--t) linear forwards; }
  .progress i.hold { animation-play-state: paused; }
  @keyframes fill { to { transform: scaleX(1); } }
  .count { font-size: 9px; letter-spacing: .2em; color: var(--grey-mid); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; align-items: center; }
  .count .state { color: #000; }
  .count .nav-btns { display: flex; gap: 4px; }
  .count .nav-btns button { width: 28px; height: 28px; border: 1px solid #000; background: #fff; cursor: pointer; font-family: var(--font); font-size: 12px; }

  .queue { display: grid; gap: 2px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(var(--qrows, 4), 1fr); }
  .q { position: relative; overflow: hidden; background: #eee; cursor: pointer; border: 0; padding: 0; color: #fff; }
  .q .img { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .8s var(--ease), opacity .5s; }
  .q:hover .img { transform: scale(1.06); }
  .q .img.out { opacity: 0; transform: scale(1.12); }
  .q .flag { position: absolute; left: 8px; top: 8px; z-index: 2; }
  .q .name {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; z-index: 2;
    display: flex; justify-content: space-between; gap: 6px;
    font-family: var(--font); font-size: 8px; letter-spacing: .18em; text-transform: uppercase; text-align: left;
    background: linear-gradient(0deg, rgba(0,0,0,.75), transparent); opacity: 0; transition: opacity .3s;
  }
  .q .name span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q:hover .name, .q.next .name { opacity: 1; }
  .q.next::after { content: "Up next"; position: absolute; right: 8px; top: 8px; z-index: 2; background: #fff; color: #000; font-family: var(--font); font-size: 8px; letter-spacing: .25em; text-transform: uppercase; padding: 3px 6px; }

  .ticker {
    position: fixed; left: 0; right: 0; bottom: 0; height: 38px; background: #000; color: #fff; overflow: hidden;
    display: flex; align-items: center;
  }
  .ticker-track { display: flex; white-space: nowrap; animation: marquee 60s linear infinite; }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  .ticker span, .ticker button { font-family: var(--font); font-size: 10px; letter-spacing: .25em; text-transform: uppercase; padding: 0 26px; color: #fff; background: none; border: none; }
  .ticker button { text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  .ticker .dot { padding: 0; opacity: .5; font-size: 6px; }
  @keyframes marquee { to { transform: translateX(-50%); } }

  .mock-replay { bottom: 50px; }
  @media (max-width: 1100px) { .stage { grid-template-columns: 1fr 260px; } .buy { padding: 22px 18px 18px; } }
  @media (max-width: 800px) {
    .stage-wrap { display: block; overflow-y: auto; }
    .stage { grid-template-columns: 1fr; grid-template-rows: 46svh auto; overflow: visible; }
    .buy { gap: 12px; padding: 18px 16px; overflow: visible; }
    .queue { margin-top: 2px; height: 46vw; }
    .buy h1 { min-height: 0; font-size: 20px; }
    .buy .offer, .brandline { display: none; }
    .queue { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); }
    .q.next::after { display: none; }
    .q .name { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .ticker-track, .slide.on .ken { animation: none; } }
</style>
</head>
<body>
<main class="stage-wrap">
  <section class="stage" id="stage" aria-label="Featured print">
    <div class="art-pane" id="artPane"><span class="zoom">Click to view larger</span></div>
    <div class="buy" id="buy">
      <div class="progress"><i id="bar"></i></div>
      <p class="brandline">Fola Adeleke — Layered memory. Living colour.</p>
      <div class="count"><span><span id="count">01 / 34</span> · <span class="state" id="state">Playing</span></span>
        <span class="nav-btns"><button type="button" id="prev" aria-label="Previous print">&larr;</button><button type="button" id="next" aria-label="Next print">&rarr;</button></span></div>
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="spec">Archival pigment print. Signed &amp; numbered, with certificate of authenticity.</p>
      <div id="purchase"></div>
      <div class="more"><a id="wall" href="/prints">See it on a wall &rarr;</a><a href="/prints">All 34 prints &rarr;</a></div>
      <p class="offer">First order? <button type="button" id="offer">Take 25% off with the Notes</button></p>
    </div>
  </section>
  <section class="queue" id="queue" aria-label="Up next"></section>
</main>
<div class="ticker" id="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

<script src="shared.js"></script>
<script>
(function () {
  var HOLD = 6000;
  var newOnes = FA.prints.filter(function (p) { return p.isNew; });
  var all = newOnes.concat(FA.shuffle(FA.prints.filter(function (p) { return !p.isNew; })));
  var pane = document.getElementById('artPane'), queueEl = document.getElementById('queue');
  var bar = document.getElementById('bar'), stateEl = document.getElementById('state');
  var idx = 0, qs = [], timer = null, held = false, locked = false, size = 'A2';

  function pad(n) { return String(n).padStart(2, '0'); }

  function slide(p) {
    var s = document.createElement('div');
    s.className = 'slide';
    var u = 'background-image:url(&quot;' + p.src + '&quot;)';
    s.innerHTML = '<div class="bed" style="' + u + '"></div><div class="ken"><div class="art" style="' + u + '"></div></div>';
    pane.insertBefore(s, pane.firstChild);
    void s.offsetWidth; s.classList.add('on');
    var olds = pane.querySelectorAll('.slide.on');
    setTimeout(function () { for (var k = 1; k < olds.length; k++) olds[k].remove(); }, 1200);
  }

  function purchase(p) {
    var box = document.getElementById('purchase');
    if (p.sold) {
      box.innerHTML = '<p class="qv-sold" style="margin-bottom:12px">This edition has sold out.</p><button class="qv-buy" type="button" id="buyBtn" style="width:100%">Join the list for the next drop</button>';
      document.getElementById('buyBtn').onclick = function () { FA.openCard(true); };
      return;
    }
    box.innerHTML = '<div class="qv-sizes" role="radiogroup" aria-label="Size" style="margin-bottom:10px">' +
      FA.sizes.map(function (s) {
        return '<button type="button" role="radio" data-size="' + s.id + '" aria-checked="' + (s.id === size) + '">' + s.id + '<small>£' + s.price + '</small></button>';
      }).join('') + '</div><a class="qv-buy" id="buyBtn" href="' + p.shop + '"></a>';
    var btn = document.getElementById('buyBtn');
    function label() { var s = FA.sizes.filter(function (x) { return x.id === size; })[0]; btn.innerHTML = 'Buy ' + s.id + ' — £' + s.price + ' &rarr;'; }
    label();
    box.querySelectorAll('[data-size]').forEach(function (b) {
      b.onclick = function () {
        size = b.getAttribute('data-size');
        box.querySelectorAll('[data-size]').forEach(function (x) { x.setAttribute('aria-checked', x === b); });
        label();
        lock();                                   // picking a size is buying intent: stop the carousel
      };
    });
  }

  function show(i) {
    idx = (i + all.length) % all.length;
    var p = all[idx];
    slide(p);
    pane.setAttribute('data-quick', p.slug);
    document.getElementById('count').textContent = pad(idx + 1) + ' / ' + pad(all.length);
    document.getElementById('kicker').innerHTML = (p.isNew ? '<span class="flag">New</span>' : p.sold ? '<span class="flag sold">Sold out</span>' : '') + 'Limited edition of ' + p.edition;
    document.getElementById('title').innerHTML = '<i>' + FA.esc(p.title) + '</i>';
    document.getElementById('wall').href = p.href;
    purchase(p);
    paintQueue();
    restartBar();
  }

  function upcoming(n) { return all[(idx + 1 + n) % all.length]; }

  function buildQueue() {
    var mobile = innerWidth <= 800, n = mobile ? 8 : 12;
    queueEl.style.setProperty('--qrows', mobile ? 2 : 4);
    queueEl.innerHTML = ''; qs = [];
    for (var k = 0; k < n; k++) {
      var b = document.createElement('button');
      b.className = 'q'; b.type = 'button';
      b.innerHTML = '<div class="img"></div><span class="name"></span>';
      (function (k) { b.onclick = function () { show(idx + 1 + k); lock(); }; })(k);
      queueEl.appendChild(b); qs.push(b);
    }
  }

  function paintQueue() {
    var cols = innerWidth <= 800 ? 4 : 3;
    qs.forEach(function (b, n) {
      var p = upcoming(n), img = b.querySelector('.img');
      var apply = function () {
        img.style.backgroundImage = 'url("' + p.src + '")';
        b.querySelector('.name').innerHTML = '<span>' + FA.esc(p.title) + '</span><span>' + FA.priceTag(p) + '</span>';
        var f = b.querySelector('.flag'); if (f) f.remove();
        if (p.isNew) b.insertAdjacentHTML('beforeend', '<span class="flag inv">New</span>');
        b.setAttribute('aria-label', 'Show ' + p.title + ', ' + FA.priceTag(p));
        img.classList.remove('out');
      };
      b.classList.toggle('next', n === 0);
      if (FA.reduced || !img.style.backgroundImage) return apply();
      var d = ((n % cols) + Math.floor(n / cols)) * 60;
      setTimeout(function () { img.classList.add('out'); setTimeout(apply, 240); }, d);
    });
  }

  // ── autoplay: hover holds it, a deliberate choice stops it ──
  function restartBar() {
    bar.classList.remove('run', 'hold');
    if (locked) { bar.style.transform = 'scaleX(0)'; return; }
    bar.style.transform = ''; bar.style.setProperty('--t', HOLD + 'ms'); void bar.offsetWidth; bar.classList.add('run');
    if (held) bar.classList.add('hold');
    clearTimeout(timer); remaining = HOLD; startedAt = Date.now();
    if (!held) timer = setTimeout(function () { show(idx + 1); }, HOLD);
  }
  var remaining = HOLD, startedAt = 0;
  function hold(on) {
    if (locked || held === on) return;
    held = on;
    if (on) { clearTimeout(timer); remaining -= Date.now() - startedAt; bar.classList.add('hold'); stateEl.textContent = 'Paused'; }
    else { bar.classList.remove('hold'); startedAt = Date.now(); timer = setTimeout(function () { show(idx + 1); }, Math.max(800, remaining)); stateEl.textContent = 'Playing'; }
  }
  function lock() { locked = true; clearTimeout(timer); bar.classList.remove('run', 'hold'); bar.style.transform = 'scaleX(0)'; stateEl.textContent = 'Browsing'; }

  var stage = document.getElementById('stage');
  stage.addEventListener('mouseenter', function () { hold(true); });
  stage.addEventListener('mouseleave', function () { hold(false); });
  FA.on(function (k, v) { hold(v); });
  document.getElementById('prev').onclick = function () { show(idx - 1); lock(); };
  document.getElementById('next').onclick = function () { show(idx + 1); lock(); };
  document.getElementById('offer').onclick = function () { FA.openCard(true); };

  function buildTicker() {
    var items = ['Limited editions of 15', 'Signed &amp; numbered', 'Certificate of authenticity', 'A3 £200 · A2 £250 · A1 £300',
      '<button type="button" data-offer>25% off your first order — join the Notes</button>',
      'New: ' + newOnes.map(function (p) { return FA.esc(p.title); }).join(' · ')];
    var html = '';
    for (var r = 0; r < 4; r++) items.forEach(function (t) { html += (t[0] === '<' ? t : '<span>' + t + '</span>') + '<span class="dot">●</span>'; });
    document.getElementById('tickerTrack').innerHTML = html;
    document.getElementById('ticker').addEventListener('click', function (e) { if (e.target.closest('[data-offer]')) FA.openCard(true); });
  }

  buildTicker(); buildQueue();
  held = true; show(0);                            // hold until the curtain lifts
  FA.boot({ preload: all.slice(0, 14) }, function () { held = false; restartBar(); });
  addEventListener('resize', function () { buildQueue(); paintQueue(); });
})();
</script>
</body>
</html>
