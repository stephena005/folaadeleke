<title>World — The Living Room (A) — Fola Adeleke®</title>

<body>
  <!-- Mockup A — "Still life": front-on room, a locked-off video loop
       (curtains, candle flames, fig leaves, passing light) under the
       real print files. The camera never moves; the room breathes. -->
  <nav class="nav">
    <div><a class="brand" href="/">Fola Adeleke®</a><span class="crumb">World / Living Room</span></div>
    <ul>
      <li><a href="/prints">Prints</a></li>
      <li><a href="/products">Products</a></li>
      <li><a href="/products" aria-current="page">World</a></li>
    </ul>
  </nav>

  <main class="stage" id="stage">
    <div class="scene" id="scene">
      <img class="plate" src="/images/world/room-a.jpg" alt="A sunlit living room: three Fola Adeleke prints above an ebony credenza with the Mama Comfort figure, a slate-blue sofa with adire and aso-oke cushions, and a rattan table with a deck of Fola Adeleke playing cards." />
      <video autoplay muted loop playsinline preload="auto" poster="/images/world/room-a.jpg" aria-hidden="true">
        <source src="/images/world/room-a-loop.mp4" type="video/mp4" />
      </video>
      <div class="dim"></div>
    </div>
  </main>

  <div class="tag" id="tag" aria-hidden="true"></div>
  <div class="caption">
    <p><small>World · Room 01</small>The Living Room</p>
    <button type="button" id="listBtn" aria-expanded="false" aria-controls="list">Shop this room</button>
  </div>
  <div class="list" id="list"></div>

  <div class="qv-scrim" id="qvScrim"></div>
  <aside class="qv" id="qv" role="dialog" aria-modal="true" aria-labelledby="qvTitle" aria-hidden="true"></aside>

  <script>

      wall: [
        { box: [715, 100, 1103, 602], quad: [[748, 128], [1072, 128], [1072, 572], [748, 572]],
